name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: central-kotlin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate Kotlin release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      - name: Verify stable release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a stable SemVer tag"
            exit 1
          }
          python3 - <<'PY'
          import os
          import pathlib
          import re

          content = pathlib.Path("build.gradle.kts").read_text()
          versions = re.findall(r'(?m)^version\s*=\s*"([^"]+)"\s*$', content)
          expected = os.environ["GITHUB_REF_NAME"][1:]
          if versions != [expected]:
              raise SystemExit(f"Expected build.gradle.kts version {expected}; found {versions}")
          PY

      - name: Run complete build, lint and coverage gates
        run: ./gradlew clean build generatePomFileForMavenJavaPublication --no-daemon --no-build-cache --console=plain

  publish:
    name: Sign and publish through Central Portal
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check out verified release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require publishing and signing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      - name: Publish signed artifacts and automatically release
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-build-cache --console=plain
